<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daybook</title>
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<aside id="side" hidden aria-label="Month and agenda"></aside>
<header class="top" id="top">
  <div class="bar1">
    <button class="back glass" id="b-back"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="m15 5-7 7 7 7"/></svg><span id="backlbl"></span></button>
    <div class="vseg glass" id="vseg" hidden role="tablist" aria-label="View"><button data-vs="day" role="tab">Day</button><button data-vs="week" role="tab">Week</button><button data-vs="month" role="tab">Month</button><button data-vs="year" role="tab">Year</button></div>
    <span class="sp"></span>
    <div class="cap glass">
      <button class="ib" id="b-mode" aria-label="Choose view" aria-haspopup="menu"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="7" rx="2.2"/><rect x="3.5" y="13" width="17" height="7" rx="2.2"/><path d="M7 16.5h6"/></svg></button>
      <button class="ib" id="b-search" aria-label="Search"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg></button>
      <button class="ib" id="b-add" aria-label="New event"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 4.5v15M4.5 12h15"/></svg></button>
    </div>
  </div>
  <div class="ttl" id="ttl"><h1 id="title"></h1></div>
  <div class="strip" id="strip"></div>
  <div class="dateline" id="dateline" hidden></div>
</header>

<main id="view"><div id="pane"></div></main>

<div class="bot">
  <button class="todaybtn glass" id="b-today">Today</button>
  <div class="cap glass tabs">
    <button class="ib tabb" id="b-calv" aria-label="Calendar"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" stroke-width="2.6"/></svg></button>
    <button class="ib tabb" id="b-lists" aria-label="Tasks"><svg class="ico" viewBox="0 0 24 24"><path d="M10 6.5h10M10 12h10M10 17.5h10"/><path d="m3.5 6.5 1.4 1.4L7.5 5.3M3.5 12l1.4 1.4 2.6-2.6M3.5 17.5l1.4 1.4 2.6-2.6"/></svg><span class="badge" id="tcount" hidden></span></button>
    <button class="ib" id="b-cals" aria-label="Settings"><span class="syncdot" id="syncdot"></span><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</div>

<div id="floats"></div>
<div id="dock"></div>
<div id="menu" class="menu glass" role="menu" hidden></div>
<div id="sheet" hidden></div>
<div id="act" hidden></div>
<div id="toast" class="glass" hidden></div>
<div id="auth" hidden></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
